<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI Text Processor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>OpenAI Text Processor</h1>
        <label for="textfile">Enter text file name:</label>
        <input type="text" id="textfile" placeholder="Press Enter for automatic generation">

        <label for="text">Enter the text:</label>
        <textarea id="text" rows="4" placeholder="Enter the text"></textarea>

        <label for="action">Select an action:</label>
        <select id="action">
            <option value="1">Grammar Check</option>
            <option value="2">Make Email</option>
            <option value="3">Translate to Different Language</option>
        </select>

        <div id="langInput" style="display: none;">
            <label for="lang">Select the language:</label>
            <input type="text" id="lang" placeholder="Enter language">
        </div>

        <button onclick="submitRequest()">Submit</button>

        <div id="result"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
